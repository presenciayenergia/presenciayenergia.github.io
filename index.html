<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presencia &amp; Energía — Soins énergétiques à Annecy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Karla:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
@layer reset, tokens, base, layout, components;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  img, svg { display: block; max-width: 100%; height: auto; }
  ul, ol { list-style: none; }
  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
}

@layer tokens {
  :root {
    --color-bg: #e6ebe4;
    --color-bg-alt: #dae2d8;
    --color-surface: #eef2ec;
    --color-text: #20302a;
    --color-text-muted: #4f5f58;
    --color-line: #b9c6bb;
    --color-lavender: #c4b2e2;
    --color-apricot: #f1c39b;
    --color-jade: #93c2ae;
    --color-cta: #20302a;
    --color-cta-text: #eef2ec;

    --font-display: 'Italiana', 'Didot', 'Bodoni 72', Georgia, serif;
    --font-base: 'Karla', 'Segoe UI', system-ui, sans-serif;

    --fs-xs: 1.3rem;
    --fs-sm: 1.5rem;
    --fs-base: 1.7rem;
    --fs-md: 1.9rem;
    --fs-h1: clamp(4.4rem, 11vw, 12rem);
    --fs-h2: clamp(3.2rem, 6vw, 6.4rem);
    --fs-h3: clamp(2.6rem, 3.6vw, 3.6rem);

    --space-1: 0.4rem;
    --space-2: 0.8rem;
    --space-3: 1.2rem;
    --space-4: 1.6rem;
    --space-6: 2.4rem;
    --space-8: 3.2rem;
    --space-12: 4.8rem;
    --space-16: 6.4rem;
    --space-24: 9.6rem;

    --radius-md: 1.2rem;
    --radius-lg: 2.8rem;
    --radius-full: 9999px;
    --border-width: 0.1rem;
    --shadow-soft: 0 1.2rem 4rem rgb(32 48 42 / 0.12);
    --ease: cubic-bezier(.22, .8, .3, 1);
    --breath: 10s;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-bg: #161c1a;
      --color-bg-alt: #1d2522;
      --color-surface: #222b28;
      --color-text: #e3e9e2;
      --color-text-muted: #a5b3ac;
      --color-line: #34413b;
      --color-lavender: #7d68a8;
      --color-apricot: #b47d55;
      --color-jade: #4f8a73;
      --color-cta: #e3e9e2;
      --color-cta-text: #161c1a;
      --shadow-soft: 0 1.2rem 4rem rgb(0 0 0 / 0.4);
    }
  }
  :root[data-theme="dark"] {
    --color-bg: #161c1a;
    --color-bg-alt: #1d2522;
    --color-surface: #222b28;
    --color-text: #e3e9e2;
    --color-text-muted: #a5b3ac;
    --color-line: #34413b;
    --color-lavender: #7d68a8;
    --color-apricot: #b47d55;
    --color-jade: #4f8a73;
    --color-cta: #e3e9e2;
    --color-cta-text: #161c1a;
    --shadow-soft: 0 1.2rem 4rem rgb(0 0 0 / 0.4);
  }
}

@layer base {
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { font-size: 62.5%; scroll-behavior: smooth; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: var(--font-base);
    font-size: var(--fs-base);
    font-weight: 300;
    line-height: 1.65;
    color: var(--color-text);
    background-color: var(--color-bg);
    overflow-x: hidden;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.04; }
  :focus-visible { outline: 0.2rem solid var(--color-text); outline-offset: 0.3rem; }
  .sr-only { position: absolute; width: 0.1rem; height: 0.1rem; margin: -0.1rem; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    html { scroll-behavior: auto; }
  }
}

@layer layout {
  .container { width: 100%; max-width: 118rem; margin-inline: auto; padding-inline: var(--space-6); }
  .section { position: relative; padding-block: var(--space-16); border-top: var(--border-width) solid var(--color-line); }
  .section__title { margin-bottom: var(--space-12); font-size: var(--fs-h2); }
  @media (min-width: 48em) {
    .container { padding-inline: var(--space-12); }
    .section { padding-block: var(--space-24); }
  }
}

@layer components {
  /* Lien souligné animé */
  .link { background: linear-gradient(currentColor, currentColor) 0 100% / 0 var(--border-width) no-repeat; transition: background-size 400ms var(--ease); }
  .link:hover, .link:focus-visible { background-size: 100% var(--border-width); }

  /* Navigation */
  .nav { position: absolute; inset: env(safe-area-inset-top, 0px) 0 auto; z-index: 10; }
  .nav__inner { display: flex; align-items: center; justify-content: space-between; padding-block: var(--space-6); }
  .nav__brand { display: flex; gap: var(--space-2); align-items: center; font-family: var(--font-display); font-size: 2.4rem; }
  .nav__mark { width: 1.4rem; height: 1.4rem; border-radius: var(--radius-full); background: conic-gradient(var(--color-lavender), var(--color-apricot), var(--color-jade), var(--color-lavender)); animation: spin 12s linear infinite; }
  .nav__links { display: none; gap: var(--space-8); font-size: var(--fs-sm); }
  @media (min-width: 56em) { .nav__links { display: flex; } }

  /* Hero */
  .hero { position: relative; display: grid; place-items: center; min-height: 100svh; overflow: hidden; text-align: center; }
  .hero__aura {
    position: absolute;
    width: min(120vw, 92rem);
    aspect-ratio: 1 / 1;
    pointer-events: none;
    transform: translate(var(--mx, 0), var(--my, 0));
    transition: transform 1.6s var(--ease);
  }
  .hero__blob { position: absolute; inset: 18%; border-radius: var(--radius-full); filter: blur(5rem); opacity: 0.85; animation: breathe var(--breath) ease-in-out infinite; }
  .hero__blob--lavender { background-color: var(--color-lavender); }
  .hero__blob--apricot { inset: 30% 22% 14% 34%; background-color: var(--color-apricot); animation-delay: -2s; }
  .hero__blob--jade { inset: 16% 36% 34% 16%; background-color: var(--color-jade); animation-delay: -4s; }
  .hero__ring { position: absolute; inset: 24%; border: var(--border-width) solid var(--color-text); border-radius: var(--radius-full); opacity: 0.25; animation: ring var(--breath) ease-in-out infinite; }
  .hero__ring--outer { inset: 12%; animation-delay: -1s; opacity: 0.12; }
  .hero__motes { position: absolute; inset: 0; pointer-events: none; }
  .hero__mote {
    position: absolute;
    bottom: -2rem;
    width: 0.6rem;
    height: 0.6rem;
    border-radius: var(--radius-full);
    background-color: var(--color-surface);
    box-shadow: 0 0 1.2rem var(--color-apricot);
    opacity: 0;
    animation: rise 14s linear infinite;
  }
  .hero__mote:nth-child(1) { left: 12%; animation-delay: 0s; }
  .hero__mote:nth-child(2) { left: 28%; animation-delay: -5s; animation-duration: 18s; }
  .hero__mote:nth-child(3) { left: 46%; animation-delay: -9s; }
  .hero__mote:nth-child(4) { left: 63%; animation-delay: -2s; animation-duration: 16s; }
  .hero__mote:nth-child(5) { left: 78%; animation-delay: -11s; }
  .hero__mote:nth-child(6) { left: 90%; animation-delay: -7s; animation-duration: 20s; }
  .hero__content { position: relative; display: grid; gap: var(--space-6); justify-items: center; padding-inline: var(--space-6); }
  .hero__title { max-width: 11ch; font-size: var(--fs-h1); letter-spacing: -0.01em; }
  .hero__lead { max-width: 38ch; font-size: var(--fs-md); color: var(--color-text-muted); }
  .hero__actions { display: flex; flex-wrap: wrap; gap: var(--space-4); justify-content: center; margin-top: var(--space-2); }
  .hero__breath {
    display: inline-flex;
    gap: var(--space-2);
    align-items: center;
    padding: var(--space-2) var(--space-6);
    border: var(--border-width) solid var(--color-line);
    border-radius: var(--radius-full);
    font-size: var(--fs-sm);
    background-color: color-mix(in srgb, var(--color-bg) 60%, transparent);
    backdrop-filter: blur(0.8rem);
  }
  .hero__breath-word { display: inline-block; min-width: 7ch; font-style: italic; text-align: left; transition: opacity 600ms ease; }
  .hero__scroll { position: absolute; bottom: var(--space-8); left: 50%; width: var(--border-width); height: 4.8rem; background-color: var(--color-text); opacity: 0.4; transform-origin: top; animation: drip 2.6s var(--ease) infinite; }

  /* Boutons */
  .btn {
    display: inline-flex;
    align-items: center;
    padding: var(--space-3) var(--space-8);
    border: var(--border-width) solid var(--color-cta);
    border-radius: var(--radius-full);
    font-size: var(--fs-sm);
    font-weight: 600;
    transition: transform 300ms var(--ease), background-color 300ms ease, color 300ms ease;
  }
  .btn:hover { transform: translateY(-0.2rem); }
  .btn--plein { color: var(--color-cta-text); background-color: var(--color-cta); }
  .btn--contour { color: var(--color-text); background-color: color-mix(in srgb, var(--color-bg) 50%, transparent); }
  .btn--contour:hover { color: var(--color-cta-text); background-color: var(--color-cta); }

  /* Bandeau de mots */
  .ruban { overflow: hidden; padding-block: var(--space-6); border-top: var(--border-width) solid var(--color-line); }
  .ruban__piste { display: flex; gap: var(--space-12); width: max-content; font-family: var(--font-display); font-size: var(--fs-h3); color: var(--color-text-muted); animation: defile 40s linear infinite; }
  .ruban__mot { display: flex; gap: var(--space-12); align-items: center; }
  .ruban__mot::after { content: ""; width: 1rem; height: 1rem; border-radius: var(--radius-full); background-color: var(--color-jade); }
  .ruban__mot:nth-child(3n+2)::after { background-color: var(--color-apricot); }
  .ruban__mot:nth-child(3n)::after { background-color: var(--color-lavender); }

  /* Intro */
  .intro { display: grid; gap: var(--space-8); }
  .intro__title { font-size: var(--fs-h2); }
  .intro__text { display: grid; gap: var(--space-4); max-width: 60ch; color: var(--color-text-muted); }
  @media (min-width: 64em) { .intro { grid-template-columns: 5fr 6fr; gap: var(--space-16); align-items: start; } }

  /* Le soin énergétique */
  .energie { display: grid; gap: var(--space-12); align-items: center; }
  .energie__text { display: grid; gap: var(--space-4); max-width: 56ch; color: var(--color-text-muted); }
  .energie__text strong { font-weight: 600; color: var(--color-text); }
  .energie__schema { position: relative; justify-self: center; width: min(100%, 36rem); aspect-ratio: 3 / 5; }
  .energie__axe { position: absolute; top: 6%; bottom: 6%; left: 50%; width: var(--border-width); background-color: var(--color-line); }
  .centres { position: absolute; inset: 6% 0; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
  .centre { position: relative; display: grid; place-items: center; width: 2.4rem; height: 2.4rem; }
  .centre__point { width: 1.4rem; height: 1.4rem; border-radius: var(--radius-full); background-color: var(--color-jade); }
  .centre__onde { position: absolute; inset: 0; border: var(--border-width) solid var(--color-jade); border-radius: var(--radius-full); animation: onde 7s ease-out infinite; }
  .centre__label { position: absolute; left: calc(100% + var(--space-4)); font-size: var(--fs-xs); white-space: nowrap; color: var(--color-text-muted); }
  .centre:nth-child(even) .centre__label { right: calc(100% + var(--space-4)); left: auto; }
  .centre:nth-child(3n+2) .centre__point { background-color: var(--color-apricot); }
  .centre:nth-child(3n+2) .centre__onde { border-color: var(--color-apricot); }
  .centre:nth-child(3n) .centre__point { background-color: var(--color-lavender); }
  .centre:nth-child(3n) .centre__onde { border-color: var(--color-lavender); }
  .centre:nth-child(1) .centre__onde { animation-delay: 0s; }
  .centre:nth-child(2) .centre__onde { animation-delay: -1s; }
  .centre:nth-child(3) .centre__onde { animation-delay: -2s; }
  .centre:nth-child(4) .centre__onde { animation-delay: -3s; }
  .centre:nth-child(5) .centre__onde { animation-delay: -4s; }
  .centre:nth-child(6) .centre__onde { animation-delay: -5s; }
  .centre:nth-child(7) .centre__onde { animation-delay: -6s; }
  @media (min-width: 64em) { .energie { grid-template-columns: 7fr 5fr; gap: var(--space-24); } }

  /* Soins */
  .soin { display: grid; gap: var(--space-4); padding-block: var(--space-8); border-top: var(--border-width) solid var(--color-line); transition: padding-inline 500ms var(--ease), background-color 500ms ease; }
  .soin:last-child { border-bottom: var(--border-width) solid var(--color-line); }
  .soin:hover { padding-inline: var(--space-4); background-color: color-mix(in srgb, var(--color-surface) 60%, transparent); }
  .soin__name { display: flex; gap: var(--space-4); align-items: center; font-size: var(--fs-h3); }
  .soin__dot { flex: none; width: 1.6rem; height: 1.6rem; border-radius: var(--radius-full); transition: transform 500ms var(--ease); }
  .soin:hover .soin__dot { transform: scale(1.6); }
  .soin__dot--lavender { background-color: var(--color-lavender); }
  .soin__dot--apricot { background-color: var(--color-apricot); }
  .soin__dot--jade { background-color: var(--color-jade); }
  .soin__desc { max-width: 52ch; color: var(--color-text-muted); }
  .soin__meta { font-size: var(--fs-sm); }
  @media (min-width: 64em) {
    .soin { grid-template-columns: 5fr 6fr 2fr; gap: var(--space-12); align-items: baseline; }
    .soin__meta { text-align: right; }
  }

  /* Accompagnement */
  .accomp { background-color: var(--color-bg-alt); overflow: hidden; }
  .accomp__intro { max-width: 56ch; margin-top: calc(var(--space-8) * -1); margin-bottom: var(--space-12); color: var(--color-text-muted); }
  .parcours { display: grid; gap: var(--space-6); }
  .parcour {
    position: relative;
    display: grid;
    gap: var(--space-4);
    align-content: start;
    padding: var(--space-8);
    border-radius: var(--radius-lg);
    overflow: hidden;
    isolation: isolate;
    background-color: var(--color-surface);
    transition: transform 500ms var(--ease), box-shadow 500ms ease;
  }
  .parcour::before {
    content: "";
    position: absolute;
    z-index: -1;
    top: -30%;
    right: -30%;
    width: 70%;
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-full);
    background-color: var(--halo);
    filter: blur(4rem);
    opacity: 0.55;
    transition: transform 800ms var(--ease), opacity 800ms ease;
  }
  .parcour:hover { transform: translateY(-0.6rem); box-shadow: var(--shadow-soft); }
  .parcour:hover::before { transform: scale(1.8); opacity: 0.8; }
  .parcour--jade { --halo: var(--color-jade); }
  .parcour--apricot { --halo: var(--color-apricot); }
  .parcour--lavender { --halo: var(--color-lavender); }
  .parcour__duree { font-size: var(--fs-sm); color: var(--color-text-muted); }
  .parcour__titre { font-size: var(--fs-h3); }
  .parcour__texte { color: var(--color-text-muted); }
  .parcour__liste { display: grid; gap: var(--space-2); padding-top: var(--space-4); border-top: var(--border-width) solid var(--color-line); font-size: var(--fs-sm); }
  .parcour__liste li { display: flex; gap: var(--space-2); }
  .parcour__liste li::before { content: ""; flex: none; width: 0.6rem; height: 0.6rem; margin-top: 0.9rem; border-radius: var(--radius-full); background-color: var(--halo); }
  .parcour__prix { margin-top: auto; padding-top: var(--space-4); font-family: var(--font-display); font-size: 3.2rem; }
  .parcour__lien { justify-self: start; font-size: var(--fs-sm); font-weight: 600; }
  @media (min-width: 64em) { .parcours { grid-template-columns: repeat(3, 1fr); } }

  /* Séance */
  .etapes { display: grid; gap: var(--space-8); counter-reset: etape; }
  .etape { display: grid; gap: var(--space-2); counter-increment: etape; }
  .etape::before { content: counter(etape); font-family: var(--font-display); font-size: 5.6rem; line-height: 1; color: var(--color-text-muted); transition: color 400ms ease; }
  .etape:hover::before { color: var(--color-apricot); }
  .etape__name { font-weight: 600; }
  .etape__text { color: var(--color-text-muted); }
  @media (min-width: 48em) { .etapes { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 64em) { .etapes { grid-template-columns: repeat(4, 1fr); gap: var(--space-12); } }

  /* Témoignages */
  .temoignage { display: grid; justify-items: center; text-align: center; }
  .temoignage__quote { max-width: 24ch; font-family: var(--font-display); font-size: var(--fs-h3); line-height: 1.25; transition: opacity 600ms ease; }
  .temoignage__author { margin-top: var(--space-6); font-size: var(--fs-sm); color: var(--color-text-muted); transition: opacity 600ms ease; }
  .temoignage__dots { display: flex; gap: var(--space-2); margin-top: var(--space-6); }
  .temoignage__dot { width: 1rem; height: 1rem; border: var(--border-width) solid var(--color-text); border-radius: var(--radius-full); transition: background-color 300ms ease; }
  .temoignage__dot[aria-current="true"] { background-color: var(--color-text); }
  .is-fading { opacity: 0; }

  /* FAQ */
  .faq { display: grid; max-width: 80rem; }
  .faq__item { border-top: var(--border-width) solid var(--color-line); }
  .faq__item:last-child { border-bottom: var(--border-width) solid var(--color-line); }
  .faq__q { display: flex; justify-content: space-between; gap: var(--space-4); padding-block: var(--space-6); font-size: var(--fs-md); list-style: none; cursor: pointer; }
  .faq__q::-webkit-details-marker { display: none; }
  .faq__q::after { content: "+"; font-family: var(--font-display); font-size: 3rem; line-height: 1; transition: transform 400ms var(--ease); }
  .faq__item[open] .faq__q::after { transform: rotate(45deg); }
  .faq__a { max-width: 60ch; padding-bottom: var(--space-6); color: var(--color-text-muted); }

  /* Rendez-vous */
  .rdv { display: grid; gap: var(--space-12); }
  .rdv__title { font-size: var(--fs-h2); }
  .rdv__text { max-width: 44ch; margin-top: var(--space-4); color: var(--color-text-muted); }
  .rdv__infos { display: grid; gap: var(--space-4); }
  .rdv__row { display: flex; justify-content: space-between; gap: var(--space-4); padding-bottom: var(--space-4); border-bottom: var(--border-width) solid var(--color-line); }
  .rdv__actions { display: flex; flex-wrap: wrap; gap: var(--space-4); margin-top: var(--space-4); }
  @media (min-width: 64em) { .rdv { grid-template-columns: 1fr 1fr; gap: var(--space-24); align-items: end; } }

  /* Footer */
  .footer { padding-block: var(--space-12) calc(var(--space-24) + env(safe-area-inset-bottom, 0px)); border-top: var(--border-width) solid var(--color-line); font-size: var(--fs-sm); color: var(--color-text-muted); }
  .footer__inner { display: grid; gap: var(--space-8); }
  .footer__brand { font-family: var(--font-display); font-size: 3.2rem; color: var(--color-text); }
  .footer__cols { display: grid; gap: var(--space-6); grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
  .footer__head { margin-bottom: var(--space-2); font-weight: 600; color: var(--color-text); }
  .footer__list { display: grid; gap: var(--space-1); }

  /* Lecteur d'ambiances */
  .sons {
    position: fixed;
    right: var(--space-4);
    bottom: calc(var(--space-4) + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    display: flex;
    gap: var(--space-1);
    align-items: center;
    padding: var(--space-1);
    border: var(--border-width) solid var(--color-line);
    border-radius: var(--radius-full);
    background-color: color-mix(in srgb, var(--color-surface) 75%, transparent);
    box-shadow: var(--shadow-soft);
    backdrop-filter: blur(1.2rem);
  }
  .sons__label { padding-inline: var(--space-3) var(--space-1); font-size: var(--fs-xs); color: var(--color-text-muted); }
  .son {
    position: relative;
    display: grid;
    place-items: center;
    width: 4.4rem;
    height: 4.4rem;
    border-radius: var(--radius-full);
    transition: background-color 300ms ease;
  }
  .son svg { width: 2.2rem; height: 2.2rem; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .son:hover { background-color: var(--color-bg-alt); }
  .son::after { content: ""; position: absolute; inset: 0; border: var(--border-width) solid var(--son-color); border-radius: var(--radius-full); opacity: 0; }

  /* Voile d'accueil */
  .accueil {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: var(--space-6);
    padding-top: calc(var(--space-6) + env(safe-area-inset-top, 0px));
    padding-bottom: calc(var(--space-6) + env(safe-area-inset-bottom, 0px));
    text-align: center;
    background-color: color-mix(in srgb, var(--color-bg) 72%, transparent);
    backdrop-filter: blur(2.4rem);
    transition: opacity 1.2s var(--ease), visibility 1.2s;
  }
  .accueil--cache { opacity: 0; visibility: hidden; }
  .accueil__boite { display: grid; gap: var(--space-6); justify-items: center; max-width: 46rem; }
  .accueil__cercle { position: relative; width: 9.6rem; aspect-ratio: 1 / 1; }
  .accueil__cercle::before, .accueil__cercle::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius-full); }
  .accueil__cercle::before { background: conic-gradient(var(--color-lavender), var(--color-apricot), var(--color-jade), var(--color-lavender)); filter: blur(1.6rem); animation: breathe var(--breath) ease-in-out infinite; }
  .accueil__cercle::after { border: var(--border-width) solid var(--color-text); opacity: 0.3; animation: ring var(--breath) ease-in-out infinite; }
  .accueil__titre { font-size: var(--fs-h2); }
  .accueil__texte { color: var(--color-text-muted); }
  .accueil__actions { display: flex; flex-wrap: wrap; gap: var(--space-4); justify-content: center; }
  .is-locked { overflow: hidden; }
  .sons__tooltip { position: absolute; bottom: calc(100% + var(--space-2)); right: 0; padding: var(--space-1) var(--space-3); border-radius: var(--radius-md); font-size: var(--fs-xs); white-space: nowrap; color: var(--color-cta-text); background-color: var(--color-cta); opacity: 0; pointer-events: none; transform: translateY(0.4rem); transition: opacity 300ms ease, transform 300ms var(--ease); }

  @keyframes breathe { 0%, 100% { transform: scale(0.82); } 40% { transform: scale(1.08); } }
  @keyframes ring { 0%, 100% { transform: scale(0.86); opacity: 0.12; } 40% { transform: scale(1.12); opacity: 0.4; } }

}

  const t = (k) => T[lang][k] ?? T.fr[k] ?? '';

  const appliquer = () => {
    document.documentElement.lang = lang;
    document.title = t('meta.titre');
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll('[data-i18n-attr]').forEach((el) => {
      el.dataset.i18nAttr.split(';').forEach((p) => {
        const [attr, key] = p.split(':');
        el.setAttribute(attr, t(key));
      });
    });
    document.querySelectorAll('.langue').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    majTemoignage(false);
    majDots();
    if (reduce) word.textContent = t('breath.slow');

  const changerLangue = (l) => {

    lang = l;

    if (reduce) { appliquer(); return; }
    document.body.classList.add('is-switching');
    setTimeout(() => {
      appliquer();
      requestAnimationFrame(() => document.body.classList.remove('is-switching'));
    }, 260);
  };

  document.querySelectorAll('[data-langues]').forEach((grp) => {
    LANGS.forEach(([code, nom]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'langue';
      b.dataset.lang = code;
      b.lang = code;
      b.textContent = code;
      b.title = nom;

  let phase = 'in';
  const setWord = (p) => {

  };
  if (!reduce) {

  const majTemoignage = (fondu = true) => {

    quote.classList.add('is-fading');
    author.classList.add('is-fading');
    setTimeout(() => {
      quote.textContent = q;
      author.textContent = a;
      quote.classList.remove('is-fading');
      author.classList.remove('is-fading');
    }, 500);
  };
  const majDots = () => {
    dots.querySelectorAll('button').forEach((b, n) => {
      b.setAttribute('aria-current', String(n === current));

  const show = (i) => { current = i; majTemoignage(); majDots(); };
  T.fr.temoignages.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'temoignage__dot';
    b.type = 'button';
    b.addEventListener('click', () => show(i));
    dots.append(b);
  });
  if (!reduce) setInterval(() => show((current + 1) % T.fr.temoignages.length), 8000);

  appliquer();

// Ambiances sonores (Web Audio, aucun fichier externe)
  let ctx, master;
  const audio = () => {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.5;
      const verb = ctx.createConvolver();
      const len = ctx.sampleRate * 3.5;
      const buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = buf.getChannelData(c);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
      }
      verb.buffer = buf;
      const wet = ctx.createGain();
      wet.gain.value = 0.45;
      master.connect(ctx.destination);
      master.connect(verb).connect(wet).connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };

  const tone = (freq, type, peak, attack, decay, dest = master) => {
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    o.connect(g).connect(dest);
    o.start(t);
    o.stop(t + attack + decay + 0.1);
  };

  const sons = {
    bol() {
      const notes = [196, 220, 261.6];
      let n = 0;
      const strike = () => {
        const f = notes[n++ % notes.length];
        [[1, 0.22], [2.76, 0.08], [5.4, 0.035], [1.004, 0.18]].forEach(([r, a]) => tone(f * r, 'sine', a, 0.02, 7));
      };
      strike();
      const id = setInterval(strike, 6500);
      return () => clearInterval(id);
    },
    souffle() {
      const out = ctx.createGain();
      out.gain.setValueAtTime(0.0001, ctx.currentTime);
      out.gain.exponentialRampToValueAtTime(0.09, ctx.currentTime + 3);
      const filtre = ctx.createBiquadFilter();
      filtre.type = 'lowpass';
      filtre.frequency.value = 500;
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.value = 0.1;
      lfoGain.gain.value = 300;
      lfo.connect(lfoGain).connect(filtre.frequency);
      filtre.connect(out).connect(master);
      const oscs = [110, 164.8, 220, 277.2].flatMap((f) => [-6, 6].map((d) => {
        const o = ctx.createOscillator();
        o.type = 'sawtooth';
        o.frequency.value = f;
        o.detune.value = d;
        o.connect(filtre);
        o.start();
        return o;
      }));
      lfo.start();
      return () => {
        const t = ctx.currentTime;
        out.gain.cancelScheduledValues(t);
        out.gain.setValueAtTime(out.gain.value, t);
        out.gain.exponentialRampToValueAtTime(0.0001, t + 2);
        setTimeout(() => { oscs.forEach((o) => o.stop()); lfo.stop(); }, 2200);
      };
    },
    carillon() {
      const gamme = [523.3, 587.3, 659.3, 784, 880, 1046.5, 1174.7];
      let id;
      const ding = () => {
        const f = gamme[Math.floor(Math.random() * gamme.length)];
        tone(f, 'triangle', 0.07, 0.005, 3.5);
        tone(f * 3.01, 'sine', 0.015, 0.005, 1.5);
        id = setTimeout(ding, 500 + Math.random() * 2200);
      };
      ding();
      return () => clearTimeout(id);
    }
  };

  const musique = () => {
    const out = ctx.createGain();
    out.gain.setValueAtTime(0.0001, ctx.currentTime);
    out.gain.exponentialRampToValueAtTime(0.55, ctx.currentTime + 4);
    const filtre = ctx.createBiquadFilter();
    filtre.type = 'lowpass';
    filtre.frequency.value = 1100;
    filtre.connect(out).connect(master);

    const accords = [
      [146.8, 220, 293.7, 370],
      [123.5, 185, 246.9, 293.7],
      [98, 196, 246.9, 293.7],
      [110, 220, 277.2, 329.6],
      [82.4, 164.8, 246.9, 329.6]
    ];
    const etincelles = [587.3, 659.3, 740, 880, 987.8];

    const voix = (f, volume, attaque, tenue, relache, type = 'sine', detune = 0) => {
      const t = ctx.currentTime;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.value = f;
      o.detune.value = detune;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(volume, t + attaque);
      g.gain.setValueAtTime(volume, t + attaque + tenue);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attaque + tenue + relache);
      o.connect(g).connect(filtre);
      o.start(t);
      o.stop(t + attaque + tenue + relache + 0.1);
    };

    let courant = 0;
    const jouer = () => {
      let suivant;
      do { suivant = Math.floor(Math.random() * accords.length); } while (suivant === courant);
      courant = suivant;
      accords[courant].forEach((f, i) => {
        voix(f, 0.05, 4, 4, 6, 'sine', -4);
        voix(f, 0.03, 4.5, 3.5, 6, 'triangle', 5);
        if (i === 0) voix(f / 2, 0.06, 5, 4, 6);
      });
      if (Math.random() < 0.6) {
        setTimeout(() => {
          const f = etincelles[Math.floor(Math.random() * etincelles.length)];
          voix(f, 0.02, 0.01, 0.1, 4, 'sine');
        }, 2000 + Math.random() * 4000);
      }
    };
    jouer();
    const id = setInterval(jouer, 8000);

    return () => {
      clearInterval(id);
      const t = ctx.currentTime;
      out.gain.cancelScheduledValues(t);
      out.gain.setValueAtTime(out.gain.value, t);
      out.gain.exponentialRampToValueAtTime(0.0001, t + 3);
      setTimeout(() => out.disconnect(), 3200);
    };
  };

  let stopMusique = null;
  const btnMusique = document.querySelector('[data-musique]');
  const basculerMusique = (on) => {
    audio();
    if (on && !stopMusique) stopMusique = musique();
    if (!on && stopMusique) { stopMusique(); stopMusique = null; }
    btnMusique.setAttribute('aria-pressed', String(Boolean(stopMusique)));
  };
  btnMusique.addEventListener('click', () => basculerMusique(!stopMusique));

  const accueil = document.querySelector('[data-accueil]');
  document.body.classList.add('is-locked');
  accueil.querySelector('[data-entrer="son"]').focus();
  const entrer = (avecSon) => {
    accueil.classList.add('accueil--cache');
    document.body.classList.remove('is-locked');
    if (avecSon) basculerMusique(true);
    setTimeout(() => accueil.setAttribute('hidden', ''), 1200);
  };
  accueil.querySelectorAll('[data-entrer]').forEach((b) => {
    b.addEventListener('click', () => entrer(b.dataset.entrer === 'son'));
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !accueil.hasAttribute('hidden')) entrer(false);
  });

  const actifs = {};
  document.querySelectorAll('[data-son]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const nom = btn.dataset.son;
      audio();
      if (actifs[nom]) {
        actifs[nom]();
        delete actifs[nom];
        btn.setAttribute('aria-pressed', 'false');
      } else {
        actifs[nom] = sons[nom]();
        btn.setAttribute('aria-pressed', 'true');
      }
    });
  });
})();
</script>
</body>
